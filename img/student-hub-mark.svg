      <circle cx="40.5" cy="10" r="3"/>
      <circle cx="7.5" cy="39" r="3"/>
      <circle cx="40.5" cy="39" r="3"/>
      <path d="M12 17c4.8-1.3 8.4.3 11 3.2v16.4c-2.6-2.8-6.2-4.4-11-3.1z"/>
