# Copies the announcements Google Sheet into the site every 15 minutes.
# If something changed, it saves (commits) data/announcements.csv and asks GitHub Pages to republish.
# You can also run it by hand: GitHub -> Actions -> Update announcements -> Run workflow.

name: Update announcements

on:
  schedule:
    - cron: "*/15 * * * *" # every 15 minutes (GitHub sometimes runs scheduled jobs a few minutes late)
  workflow_dispatch: # adds a "Run workflow" button

# Never run two copies of this robot at the same time
concurrency:
  group: update-announcements
  cancel-in-progress: false

permissions:
  contents: write # to save the file
  pages: write # to ask GitHub Pages to republish

jobs:
  update-announcements:
    runs-on: ubuntu-latest
    steps:
      - name: Get the project files
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copy the sheet
        run: node scripts/fetch-announcements.js

      - name: Save changes and republish, if any
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/announcements.csv
          if git diff --staged --quiet; then
            echo "Announcements unchanged."
            exit 0
          fi
          git commit -m "Update announcements from Google Sheet"
          # Another robot (the calendar) may have saved something meanwhile: get it first
          git pull --rebase
          git push
          # Ask GitHub Pages to publish the new version
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
