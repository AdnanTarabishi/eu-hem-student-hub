name: Integrate FHEM final review

on:
  push:
    branches:
      - feature/fhem-final-exam-review
    paths:
      - ".github/workflows/integrate-fhem-final-review.yml"

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fhem-final-exam-review
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Link, cache and stamp the final review
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          course = Path("health-econ-management.js")
          text = course.read_text()
          replacements = [
              (
                  '["exam", "Exam centre", "fhem-exam.html"],\n      ["resources", "Resources",',
                  '["exam", "Exam centre", "fhem-exam.html"],\n      ["review", "Final review", "review/fhem-final-review.html"],\n      ["resources", "Resources",',
              ),
              (
                  '<a href="fhem-exam.html">Current-content mock ready →</a>',
                  '<a href="review/fhem-final-review.html">Final review · exam 27 Oct →</a>\n        <a href="fhem-exam.html">Current-content mock ready →</a>',
              ),
              (
                  'link("Exam centre", "fhem-exam.html", "hem-button hem-secondary"),\n    );',
                  'link("Exam centre", "fhem-exam.html", "hem-button hem-secondary"),\n      link("Final review", "review/fhem-final-review.html", "hem-button hem-secondary"),\n    );',
              ),
              (
                  'toolCard("05 / SIMULATE", "Exam centre", "Run a 90-minute mixed mock or a 20-minute objective drill using the question bank from the available Hub sessions.", "fhem-exam.html", "90 min"),\n    );',
                  'toolCard("05 / SIMULATE", "Exam centre", "Run a 90-minute mixed mock or a 20-minute objective drill using the question bank from the available Hub sessions.", "fhem-exam.html", "90 min"),\n      toolCard("06 / FINAL REVIEW", "Tomorrow’s exam review", "Connect all eight sessions, rehearse the TA Grossman review, complete 26 recall questions and write against a 60-point rubric.", "review/fhem-final-review.html", "6+2+1"),\n    );',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected course-hub text not found: {old[:80]}")
              text = text.replace(old, new, 1)
          course.write_text(text)

          sw = Path("sw.js")
          text = sw.read_text()
          marker = '"quant-methods.css", "quant-methods.js", "health-econ-management.css", "health-econ-management.js", "fhem-exam.css", "fhem-exam.js", "fhem-exam-v2.css", "fhem-exam-style-bank.js", "fhem-exam-v2.js",\n'
          addition = marker + '  "review/fhem-final-review.html", "review/fhem-final-review.css", "review/fhem-final-review-data.js", "review/fhem-final-review.js",\n'
          if '"review/fhem-final-review.html"' not in text:
              if marker not in text:
                  raise SystemExit("Service-worker insertion point not found")
              text = text.replace(marker, addition, 1)
          sw.write_text(text)
          PY
          node scripts/stamp-versions.js
          rm -f .github/workflows/integrate-fhem-final-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate FHEM final review into course hub"
          git push origin HEAD:feature/fhem-final-exam-review
