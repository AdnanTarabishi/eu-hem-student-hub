name: Update FHEM fixed mock regression count
on:
  push:
    branches: [feature/fhem-exam-eve-review]
    paths:
      - 'scripts/update-exam-style-fixed-mock-count.js'
      - '.github/workflows/exam-style-fixed-mock-count.yml'
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fhem-exam-eve-review
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check scripts/update-exam-style-fixed-mock-count.js
          node scripts/update-exam-style-fixed-mock-count.js
          node --check tests/fhem-exam-style/browser.test.js
      - name: Commit updated regression count
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/fhem-exam-style/browser.test.js
          git commit -m 'Update FHEM fixed mock regression count'
          git push origin HEAD:feature/fhem-exam-eve-review
