name: Assemble reviewed Right to Health workspace
on:
  push:
    branches: [codex/right-to-health-20261008]
permissions:
  contents: write
jobs:
  assemble:
    if: startsWith(github.event.head_commit.message, 'Assemble Right to Health')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Integrate exact course files onto updated main
        run: |
          python3 .rth-stage/rebase.py prepare
          cd "$RUNNER_TEMP/rth-release"
          node scripts/build-content-index.js
          node scripts/stamp-versions.js
      - name: Validate the combined site
        run: |
          cd "$RUNNER_TEMP/rth-release"
          node --test tests/right-to-health/content.test.js
          node scripts/check-content.js
          node scripts/check-contrast.js
          node --check right-to-health.js
          node --check notes-course.js
          git diff --check
      - name: Re-run 93 adapted inline browser checks on the combined site
        run: |
          python3 -m pip install playwright==1.57.0
          CHROME=$(command -v google-chrome || command -v chromium || true)
          if [ -z "$CHROME" ]; then
            python3 -m playwright install chromium
            CHROME=$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          fi
          cd "$RUNNER_TEMP/rth-release"
          EUHEM_SITE_ROOT=. CHROMIUM_BINARY="$CHROME" EUHEM_TEST_OUTPUT="$RUNNER_TEMP/rth-browser" python3 tests/right-to-health/browser.py
      - name: Publish clean candidate without modifying main
        run: python3 .rth-stage/rebase.py publish
