# Rebuilds the calendar file from the official UniBo pages every 6 hours.
# If something changed, it saves (commits) the new file, and GitHub Pages publishes it.
# You can also run it by hand: GitHub -> Actions -> Update calendar -> Run workflow.

name: Update calendar

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours, at minute 17 (UTC)
  workflow_dispatch: # adds a "Run workflow" button

# Allows this workflow to push commits to the repository
permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Get the project files
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the calendar
        run: node scripts/build-calendar.js

      - name: Save changes, if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar
          if git diff --staged --quiet; then
            echo "Calendar unchanged."
          else
            git commit -m "Update calendar from UniBo"
            git push
          fi
