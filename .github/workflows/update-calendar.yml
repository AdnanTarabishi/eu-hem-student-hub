# Rebuilds the calendar files from the official UniBo pages every hour.
# If something changed, it saves (commits) the new file, and GitHub Pages publishes it.
# You can also run it by hand: GitHub -> Actions -> Update calendar -> Run workflow.

name: Update calendar

on:
  schedule:
    - cron: "17 * * * *" # hourly at minute 17 UTC (GitHub schedules may run late)
  workflow_dispatch: # adds a "Run workflow" button

permissions:
  contents: write # save generated subscriptions
  pages: write # request a Pages rebuild when needed

concurrency:
  group: update-calendar-main
  cancel-in-progress: false

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Get the project files
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the calendar
        run: node scripts/build-calendar.js
      - name: Explain failed source synchronization
        if: failure()
        run: |
          echo "::error::UniBo sync failed. The last published calendar remains available; check the official UniBo timetable."
          echo "### UniBo timetable synchronization failed" >> "$GITHUB_STEP_SUMMARY"
          echo "The previous calendar files were preserved. Inspect the HTTP error and try **Run workflow** again; check UniBo for recent room changes." >> "$GITHUB_STEP_SUMMARY"

      - name: Save changes and republish, if any
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar
          if git diff --staged --quiet; then
            echo "Calendar unchanged."
            exit 0
          fi
          git commit -m "Update calendar from UniBo"
          # Another robot (announcements) may have saved something meanwhile: get it first
          git pull --rebase
          git push
          # Ask GitHub Pages to publish the new version
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
