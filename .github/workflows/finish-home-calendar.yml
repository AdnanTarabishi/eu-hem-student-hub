name: Finish scoped homepage calendar layout
on:
  push:
    branches: ['codex/home-calendar-20261010']
    paths: ['.github/workflows/finish-home-calendar.yml']
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/home-calendar-20261010
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Keep long menu descriptions within their dropdown
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          for(const [file,scope] of [['home-roadmap-preview.css','.eh-home'],['calendar-page.css','.calendar-page']]){
            fs.appendFileSync(file,`\n/* Descriptions must wrap rather than inherit the menu trigger's nowrap rule. */\n${scope} .menu-dropdown .menu-link{grid-template-columns:34px minmax(0,1fr);white-space:normal}\n${scope} .menu-dropdown .menu-link-text{min-width:0}\n`);
          }
          fs.unlinkSync('.github/workflows/finish-home-calendar.yml');
          NODE
          node scripts/stamp-versions.js
      - run: node scripts/check-content.js && node scripts/check-contrast.js && node scripts/stamp-versions.js --check
      - run: node tests/home-calendar/browser.test.js .
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/home-calendar
      - run: PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())") node tests/home/browser.test.js .
      - run: node tests/roadmap/browser.test.js .
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/roadmap
      - name: Save the checked layout on the feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'Wrap long navigation descriptions on homepage and Calendar'
          git push origin HEAD:codex/home-calendar-20261010
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-calendar-final-previews
          path: ${{ runner.temp }}/home-calendar
          retention-days: 7
          if-no-files-found: ignore
