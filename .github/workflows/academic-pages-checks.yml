name: Check academic pages

on:
  # Keep branch checks running while unrelated main updates are being integrated.
  push:
    branches:
      - "codex/academic-pages-redesign-*"
  pull_request:
    paths:
      - "academic-rules.html"
      - "academic-rules.js"
      - "academic-rules.css"
      - "journey.html"
      - "journey.js"
      - "journey.css"
      - "academic-pages.css"
      - "academic-pages.js"
      - "content/academic-rules.json"
      - "content/programme-events.json"
      - "content/tracks.json"
      - "content/sources.json"
      - "tracks-data.js"
      - "guide-data.js"
      - "tests/academic-pages/**"
      - "tests/handbook/data.test.js"
      - ".github/workflows/academic-pages-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academic-pages-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  academic-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install existing test dependencies
        run: npm ci
      - name: Install Chromium for the browser checks
        run: npx playwright install --with-deps chromium
      - name: Check content, sources and contrast
        run: |
          node scripts/check-content.js
          node scripts/check-contrast.js
          node tests/handbook/data.test.js .
      - name: Check academic page navigation, content and browser behavior
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/academic-page-screenshots
        run: node tests/academic-pages/browser.test.js .
      - name: Save visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-pages-visual-checks
          path: ${{ runner.temp }}/academic-page-screenshots
          if-no-files-found: ignore
          retention-days: 7
