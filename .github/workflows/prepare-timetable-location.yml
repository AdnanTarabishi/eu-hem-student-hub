name: Prepare timetable progress and location update
# Final re-run after case-insensitive classroom rendering assertions.
on:
  push:
    branches: ['codex/timetable-progress-location-20261010']
    paths: ['.github/workflows/prepare-timetable-location.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/timetable-progress-location-20261010
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Stamp updated browser assets
        run: node scripts/stamp-versions.js
      - name: Validate content, contrast and timetable logic
        run: |
          node scripts/check-content.js
          node scripts/check-contrast.js
          node tests/planning/calendar.test.js
          node tests/planning/progress.test.js
          node tests/planning/locations.test.js
          node tests/planning/progress-browser.test.js .
          node tests/planning/timetable-v2.test.js .
      - name: Commit only tested stamps and remove this temporary workflow
        run: |
          rm .github/workflows/prepare-timetable-location.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'Stamp verified timetable progress and location assets'
          git push origin HEAD:codex/timetable-progress-location-20261010
