name: Notes workspace checks
on:
  pull_request:
    paths:
      - 'notes*'
      - 'content/**'
      - 'programme.js'
      - 'unibo-data.js'
      - 'style.css'
      - 'ui.js'
      - 'site-nav.js'
      - 'sw.js'
      - 'tests/notes/**'
      - '.github/workflows/notes-workspace-checks.yml'
  push:
    branches: [codex/notes-workspace-20261009]
    paths:
      - 'notes*'
      - 'tests/notes/**'
      - '.github/workflows/notes-workspace-checks.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install development test tools
        run: |
          npm ci
          CHROME=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$CHROME" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$CHROME" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Content, contrast and dates
        run: |
          node scripts/check-content.js
          node scripts/check-contrast.js
          node tests/notes/schedule.test.js
          node scripts/stamp-versions.js
          git diff --exit-code -- '*.html' '*.js'
      - name: Existing library regressions
        run: node tests/notes/browser.test.js .
      - name: Workspace interactions and responsive previews
        env:
          NOTES_SCREENSHOT_DIR: review-artifacts/notes
        run: node tests/notes/workspace.test.js .
      - name: Quiz, exam and flashcard regressions
        if: always()
        env:
          STUDY_PRACTICE_SCREENSHOT_DIR: review-artifacts/practice
        run: node tests/notes/practice.test.js .
      - name: Record source identity
        if: always()
        run: |
          mkdir -p review-artifacts
          git rev-parse HEAD > review-artifacts/source-commit.txt
          sha256sum notes.html notes-landing.js notes-landing.css sw.js > review-artifacts/source-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notes-workspace-review
          path: review-artifacts/
          retention-days: 7
