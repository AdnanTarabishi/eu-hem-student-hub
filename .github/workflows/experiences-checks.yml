name: Check Student Experiences

on:
  pull_request:
    paths:
      - "experiences*"
      - "assets/experiences/**"
      - "contact-config.js"
      - "integrations/contact-apps-script/**"
      - "privacy.html"
      - "style.css"
      - "site-nav.js"
      - "utils.js"
      - "tests/experiences/**"
      - ".github/workflows/experiences-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experiences-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  experiences:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install existing test dependencies
        run: npm ci
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - name: Check content, form delivery and browser behaviour with fictional fixtures
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/experiences-screenshots
        run: |
          npm run test:experiences
          node scripts/check-contrast.js
      - name: Save visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiences-visual-checks
          path: ${{ runner.temp }}/experiences-screenshots
          if-no-files-found: ignore
          retention-days: 7
