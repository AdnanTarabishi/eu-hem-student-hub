name: Session 6 test diagnostics
on:
  push:
    branches: [feature/fhe-session-6]
    paths:
      - '.github/workflows/session6-test-diagnostics.yml'
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fhe-session-6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Make university-resource expectation content-driven
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'tests/notes/course-interiors.test.js';
          let text = fs.readFileSync(file, 'utf8');
          const anchor = "const courses = read('content/programme.json').cohorts[0].terms[0].courses;";
          const addition = `${anchor}\nconst fhemResources = read('content/modules/fund-health-economics/resources.json');\nconst expectedFhemUniversityResources = fhemResources.filter(resource => {\n  if (resource.sample || !resource.url) return false;\n  try { return new URL(resource.url).hostname.endsWith('unibo.it'); } catch { return false; }\n}).length;`;
          if (!text.includes('expectedFhemUniversityResources')) text = text.replace(anchor, addition);
          text = text.replace("assert.equal(await p.locator('.cw-source-university').count(),4);", "assert.equal(await p.locator('.cw-source-university').count(),expectedFhemUniversityResources);");
          fs.writeFileSync(file, text);
          NODE
      - name: Capture course-interiors output
        continue-on-error: true
        env:
          COURSE_SCREENSHOT_DIR: previews/course-interiors
        run: node tests/notes/course-interiors.test.js . > session6-course-test.log 2>&1
      - name: Capture practice output
        continue-on-error: true
        env:
          STUDY_PRACTICE_SCREENSHOT_DIR: previews/practice
        run: node tests/notes/practice.test.js . > session6-practice-test.log 2>&1
      - name: Commit test patch and diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/notes/course-interiors.test.js session6-course-test.log session6-practice-test.log
          git commit -m 'Make FHEM resource test content-driven and record diagnostics'
          git push origin HEAD:feature/fhe-session-6
