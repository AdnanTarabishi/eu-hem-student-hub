name: Session 6 test diagnostics
on:
  push:
    branches: [feature/fhe-session-6]
    paths:
      - '.github/workflows/session6-test-diagnostics.yml'
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fhe-session-6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture course-interiors output
        continue-on-error: true
        run: node tests/notes/course-interiors.test.js . > session6-course-test.log 2>&1
      - name: Capture practice output
        continue-on-error: true
        run: node tests/notes/practice.test.js . > session6-practice-test.log 2>&1
      - name: Commit diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add session6-course-test.log session6-practice-test.log
          git commit -m 'Record Session 6 browser test diagnostics'
          git push origin HEAD:feature/fhe-session-6
