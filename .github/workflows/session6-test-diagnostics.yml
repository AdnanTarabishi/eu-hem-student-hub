name: Session 6 test diagnostics
on:
  push:
    branches: [feature/fhe-session-6]
    paths:
      - '.github/workflows/session6-test-diagnostics.yml'
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fhe-session-6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Make FHEM expectations content-driven
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const courseFile = 'tests/notes/course-interiors.test.js';
          let course = fs.readFileSync(courseFile, 'utf8');
          const courseAnchor = "const courses = read('content/programme.json').cohorts[0].terms[0].courses;";
          const courseAddition = `${courseAnchor}\nconst fhemResources = read('content/modules/fund-health-economics/resources.json');\nconst expectedFhemUniversityResources = fhemResources.filter(resource => {\n  if (resource.sample || !resource.url) return false;\n  try { return new URL(resource.url).hostname.endsWith('unibo.it'); } catch { return false; }\n}).length;`;
          if (!course.includes('expectedFhemUniversityResources')) course = course.replace(courseAnchor, courseAddition);
          course = course.replace("assert.equal(await p.locator('.cw-source-university').count(),4);", "assert.equal(await p.locator('.cw-source-university').count(),expectedFhemUniversityResources);");
          fs.writeFileSync(courseFile, course);

          const practiceFile = 'tests/notes/practice.test.js';
          let practice = fs.readFileSync(practiceFile, 'utf8');
          const practiceAnchor = 'const cards = read("content/modules/fund-health-economics/flashcards.json");';
          const practiceAddition = `${practiceAnchor}\nconst fhemPath = read("content/modules/fund-health-economics/learning-path.json");\nconst quickObjectiveTotal = fhemPath.sessions.filter(session => session.status === "available").length * 3;`;
          if (!practice.includes('quickObjectiveTotal')) practice = practice.replace(practiceAnchor, practiceAddition);
          practice = practice.replace('    assert.match(await page.locator(".hem-exam-toolbar-title").innerText(), /1 of 15 answered/);', '    assert.match(await page.locator(".hem-exam-toolbar-title").innerText(), new RegExp(`1 of ${quickObjectiveTotal} answered`));');
          practice = practice.replaceAll('    assert.match(await page.locator(".hem-exam-result-hero h1").innerText(), /1 of 15 objective/);', '    assert.match(await page.locator(".hem-exam-result-hero h1").innerText(), new RegExp(`1 of ${quickObjectiveTotal} objective`));');
          practice = practice.replace('    assert.equal(savedExam.history[0].objectiveTotal, 15);', '    assert.equal(savedExam.history[0].objectiveTotal, quickObjectiveTotal);');
          fs.writeFileSync(practiceFile, practice);
          NODE
      - name: Capture course-interiors output
        continue-on-error: true
        env:
          COURSE_SCREENSHOT_DIR: previews/course-interiors
        run: node tests/notes/course-interiors.test.js . > session6-course-test.log 2>&1
      - name: Capture practice output
        continue-on-error: true
        env:
          STUDY_PRACTICE_SCREENSHOT_DIR: previews/practice
        run: node tests/notes/practice.test.js . > session6-practice-test.log 2>&1
      - name: Commit test patches and diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/notes/course-interiors.test.js tests/notes/practice.test.js session6-course-test.log session6-practice-test.log
          git commit -m 'Make FHEM browser tests content-driven and record diagnostics'
          git push origin HEAD:feature/fhe-session-6
