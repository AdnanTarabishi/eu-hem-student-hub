name: Diagnose official UniBo data mismatch
on:
  push:
    branches: [fix/unibo-course-authoritative-timetable-20261012]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/diagnose-unibo-sources.mjs
