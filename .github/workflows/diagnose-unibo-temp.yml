name: Diagnose official UniBo data mismatch
on:
  push:
    branches: [fix/unibo-course-authoritative-timetable-20261012]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/diagnose-unibo-sources.mjs
      - name: Verify and parse public course pages
        run: node scripts/update-unibo-timetable.js
      - name: Test verified parser and calendar fallbacks
        run: node tests/planning/unibo-course-source.test.js && node tests/planning/calendar-revisions.test.js
      - name: Generate verified calendar subscriptions
        run: node scripts/build-calendar.js
      - name: Save validated course snapshot in the fix branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/unibo-verified-timetable.json calendar/
          if ! git diff --staged --quiet; then
            git commit -m "Publish official per-course timetable snapshot"
            git pull --rebase origin fix/unibo-course-authoritative-timetable-20261012
            git push origin HEAD:fix/unibo-course-authoritative-timetable-20261012
          fi
