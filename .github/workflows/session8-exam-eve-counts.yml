name: Update Session 8 exam-eve counts
on:
  push:
    branches: [feature/fhem-exam-eve-review]
    paths:
      - 'scripts/update-session8-exam-eve-counts.js'
      - '.github/workflows/session8-exam-eve-counts.yml'
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fhem-exam-eve-review
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check scripts/update-session8-exam-eve-counts.js
          node scripts/update-session8-exam-eve-counts.js
          node --check tests/fhe-session-8/browser.test.js
      - name: Commit updated regression counts
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/fhe-session-8/browser.test.js
          git commit -m 'Update Session 8 exam-eve regression counts'
          git push origin HEAD:feature/fhem-exam-eve-review
