name: Restamp FHEM exam-eve assets
on:
  push:
    branches: [feature/fhem-exam-eve-review]
    paths:
      - '.github/workflows/fhem-exam-eve-restamp.yml'
permissions:
  contents: write
jobs:
  restamp:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fhem-exam-eve-review
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/stamp-versions.js
      - run: node scripts/stamp-versions.js --check
      - name: Commit fingerprints
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' '*.js'
          git commit -m 'Refresh FHEM exam-eve asset fingerprints'
          git push origin HEAD:feature/fhem-exam-eve-review
