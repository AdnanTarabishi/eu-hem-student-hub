name: Reconcile UniBo timetable fix with newer main
on:
  push:
    branches: [fix/unibo-course-authoritative-timetable-20261012]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unibo-course-authoritative-timetable-20261012
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge newer main preserving Tracks changes on conflicting page lines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit -X theirs origin/main
          node scripts/stamp-versions.js
          git add -- '*.html' sw.js
          if ! git diff --staged --quiet; then
            git commit -m "Restamp verified timetable assets after merging main"
          fi
          node scripts/stamp-versions.js --check
          node tests/planning/unibo-course-source.test.js
          git push origin HEAD:fix/unibo-course-authoritative-timetable-20261012
