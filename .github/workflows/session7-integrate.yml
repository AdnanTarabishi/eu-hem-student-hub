name: Session 7 integrate
on:
  push:
    branches: [feature/fhe-session-7]
    paths:
      - 'scripts/integrate-session7.js'
      - '.github/workflows/session7-integrate.yml'
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fhe-session-7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic Session 7 corrections
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const jsFile = 'fhe-session-7.js';
          let js = fs.readFileSync(jsFile, 'utf8');
          const before = '["Risk status","revealed?"Higher risk revealed":"Risk not yet fully revealed"]';
          const after = '["Risk status", revealed ? "Higher risk revealed" : "Risk not yet fully revealed"]';
          if (js.includes(before)) js = js.replace(before, after);
          if (!js.includes(after)) throw new Error('Session 7 premium-risk correction was not applied.');
          fs.writeFileSync(jsFile, js);

          const noteFile = 'content/modules/fund-health-economics/notes/adverse-selection.md';
          let note = fs.readFileSync(noteFile, 'utf8');
          if (!note.startsWith('---\n')) {
            note = '---\ntopic: fund-health-economics.adverse-selection\nupdated: 2026-10-20\n---\n\n' + note;
          }
          if (!note.includes('## 5-minute review')) {
            note += '\n\n## 5-minute review\n\n' + [
              '- Random expenditure variation creates the core value of insurance; systematic variation drives pricing and selection problems.',
              '- With hidden risk, generous coverage attracts a higher-risk mix and can become expensive through adverse selection.',
              '- The mixed-pool break-even premium is `πP = [λpL + (1−λ)pH]I`.',
              '- In `yH–yS` space, full insurance lies on the 45-degree line and a type-p zero-profit line has slope `−(1−p)/p`.',
              '- First-best type-specific full insurance is not incentive compatible because high risks imitate the low-risk contract.',
              '- Competitive cream-skimming destroys pooling equilibria in the standard Rothschild–Stiglitz argument.',
              '- A separating equilibrium gives H fair full insurance and L fair partial insurance, so low risks are quantity constrained.',
              '- When low risks are a large majority, the competitive market may have no equilibrium.',
              '- A suitable compulsory pooling base plus supplementary insurance can improve welfare by subsidising H and relaxing L rationing.',
              '- Premium risk is the risk of higher future premiums after health information reveals a persistently higher expected cost.'
            ].join('\n') + '\n';
          }
          fs.writeFileSync(noteFile, note);
          NODE
      - name: Check Session 7 JavaScript syntax
        run: |
          node --check fhe-session-7.js
          node --check fhe-session-7-runtime.js
          node --check fhe-session-7-page.js
          node --check fhe-session-7-links.js
          node --check scripts/integrate-session7.js
      - name: Integrate canonical Session 7 data
        run: node scripts/integrate-session7.js
      - name: Rebuild content index
        run: node scripts/build-content-index.js
      - name: Stamp asset versions
        run: node scripts/stamp-versions.js
      - name: Validate integrated content
        run: node scripts/check-content.js
      - name: Commit canonical content
        run: |
          if git diff --quiet; then
            echo 'No integration changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content course.html notes.html fhem-exam.html fhe-session-7.html fhe-session-7.js sw.js
          git commit -m 'Integrate Session 7 into the FHEM study system'
          git push origin HEAD:feature/fhe-session-7
