name: Notes workspace staging and review
on:
  push:
    branches: [codex/notes-workspace-20261009]
    paths: [.github/workflows/notes-workspace-apply.yml]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/notes-workspace-20261009
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialise the reviewed, checksum-verified source transfer
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, re, subprocess, zlib
          root = pathlib.Path('.')
          chunks = [root / f'scripts/notes-transfer/part-{i}.txt' for i in range(1,5)]
          encoded = ''.join(p.read_text().strip() for p in chunks)
          assert hashlib.sha256(encoded.encode()).hexdigest() == '1bd1ea2e5bba4135a2981f8945ee34198b0b3daa5348dca40403398270e0f0df', 'Transfer integrity check failed'
          data = json.loads(zlib.decompress(base64.b64decode(encoded, validate=True)))
          expected_files = {'notes-landing.css','docs/notes-workspace-prompt.md','docs/notes-workspace.md','tests/notes/workspace.test.js'}
          expected_patch = {'notes-landing.js','notes.html','sw.js','tests/notes/browser.test.js'}
          assert set(data['files']) == expected_files
          assert set(re.findall(r'^diff --git a/\S+ b/(\S+)$',data['patch'],re.M)) == expected_patch
          patch = pathlib.Path('/tmp/notes-workspace.patch')
          patch.write_text(data['patch'])
          check = subprocess.run(['git','apply','--check',str(patch)],capture_output=True,text=True)
          if check.returncode:
              subprocess.run(['git','apply','--reverse','--check',str(patch)],check=True)
              print('Reviewed patch already applied; retaining it.')
          else:
              subprocess.run(['git','apply',str(patch)],check=True)
          for filename, content in data['files'].items():
              target = root / filename
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(content)
          print('Applied only the eight reviewed Notes source, test and documentation files.')
          PY
          node scripts/stamp-versions.js
          node scripts/check-content.js
          node --check notes-landing.js
          git add notes.html notes-landing.css notes-landing.js sw.js tests/notes/browser.test.js tests/notes/workspace.test.js docs/notes-workspace-prompt.md docs/notes-workspace.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Rebuild Notes as a resource-first study workspace'
            git push origin HEAD:codex/notes-workspace-20261009
          fi
      - name: Install test tools
        run: |
          npm ci
          CHROME=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$CHROME" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$CHROME" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Validate content, colour tokens and schedule boundaries
        run: |
          node scripts/check-content.js
          node scripts/check-contrast.js
          node tests/notes/schedule.test.js
      - name: Existing Notes browser regressions
        run: node tests/notes/browser.test.js .
      - name: New workspace real-browser checks and screenshots
        env:
          NOTES_SCREENSHOT_DIR: review-artifacts/notes
        run: node tests/notes/workspace.test.js .
      - name: Existing quiz, exam and flashcard regressions
        env:
          STUDY_PRACTICE_SCREENSHOT_DIR: review-artifacts/practice
        run: node tests/notes/practice.test.js .
      - name: Record reviewed source identity
        if: always()
        run: |
          mkdir -p review-artifacts
          git rev-parse HEAD > review-artifacts/source-commit.txt
          git diff 0cf7b1a6151983ad68c8cbefa984735745bd09c6 -- notes.html notes-landing.css notes-landing.js sw.js tests/notes/browser.test.js tests/notes/workspace.test.js docs/notes-workspace-prompt.md docs/notes-workspace.md > review-artifacts/reviewed-source.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notes-workspace-review
          path: review-artifacts/
          retention-days: 3
