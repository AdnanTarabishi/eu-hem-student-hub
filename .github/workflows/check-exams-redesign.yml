name: Check Exams redesign
on:
  pull_request:
    paths: ['exams.html','exams.js','exams-guide.css','unibo-data.js','content/programme.json','tests/planning/**','.github/workflows/check-exams-redesign.yml']
  push:
    paths: ['exams.html','exams.js','exams-guide.css','unibo-data.js','content/programme.json','tests/planning/**','.github/workflows/check-exams-redesign.yml']
jobs:
  exam-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-content.js
      - run: node scripts/check-contrast.js
      - run: node tests/planning/exams-grouped.test.js
      - run: node tests/planning/browser.test.js .
