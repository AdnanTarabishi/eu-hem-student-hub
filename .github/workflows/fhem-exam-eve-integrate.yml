name: Integrate FHEM exam-eve review
on:
  push:
    branches: [feature/fhem-exam-eve-review]
    paths:
      - 'scripts/integrate-fhem-exam-eve.js'
      - '.github/workflows/fhem-exam-eve-integrate.yml'
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fhem-exam-eve-review
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check new JavaScript
        run: |
          node --check fhem-exam-eve-data.js
          node --check fhem-final-review.js
          node --check scripts/integrate-fhem-exam-eve.js
      - name: Integrate final-review content
        run: node scripts/integrate-fhem-exam-eve.js
      - name: Rebuild and stamp
        run: |
          node scripts/build-content-index.js
          node scripts/stamp-versions.js
      - name: Validate content and key invariants
        run: |
          node scripts/check-content.js
          node scripts/stamp-versions.js --check
          node - <<'NODE'
          const fs = require('fs');
          const assert = require('assert/strict');
          const pages = ['course.html','notes.html','lecture.html','fhem-exam.html','fhem-final-review.html'];
          for (const page of pages) {
            const text = fs.readFileSync(page,'utf8');
            assert.ok(text.includes('fhem-exam-eve-data.js'), `${page}: exam-eve data script missing`);
          }
          const review = fs.readFileSync('fhem-final-review.html','utf8');
          assert.ok(review.includes('fhem-final-review.css'));
          assert.ok(review.includes('fhem-final-review.js'));
          assert.ok(review.includes('og:title'));
          const hub = fs.readFileSync('health-econ-management.js','utf8');
          assert.ok(hub.includes('Final review'));
          const notes3 = fs.readFileSync('content/modules/fund-health-economics/notes/health-capital.md','utf8');
          const notes4 = fs.readFileSync('content/modules/fund-health-economics/notes/disparities.md','utf8');
          const notes5 = fs.readFileSync('content/modules/fund-health-economics/notes/physician-agency.md','utf8');
          assert.ok(notes3.includes('TA review addendum: Grossman made simple'));
          assert.ok(notes4.includes('TA notation addendum'));
          assert.ok(notes5.includes('a fee cut in three moves'));
          console.log('FHEM exam-eve integration invariants pass.');
          NODE
      - name: Commit integrated review
        run: |
          if git diff --quiet; then
            echo 'No integration changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content course.html notes.html lecture.html fhem-exam.html fhem-final-review.html health-econ-management.js health-econ-management.css sw.js
          git commit -m 'Integrate FHEM exam-eve review'
          git push origin HEAD:feature/fhem-exam-eve-review
