name: Restamp and verify timetable location update
on:
  push:
    branches: ['codex/timetable-progress-location-20261010']
    paths: ['.github/workflows/restamp-timetable-location.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/timetable-progress-location-20261010
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/stamp-versions.js
      - run: |
          node scripts/check-content.js
          node scripts/check-contrast.js
          node tests/planning/locations.test.js
          node tests/planning/progress-browser.test.js .
          node tests/planning/browser.test.js .
          node tests/planning/timetable-v2.test.js .
      - name: Commit only the verified stamps and remove this workflow
        run: |
          rm .github/workflows/restamp-timetable-location.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'Restamp verified timetable location details'
          git push origin HEAD:codex/timetable-progress-location-20261010
