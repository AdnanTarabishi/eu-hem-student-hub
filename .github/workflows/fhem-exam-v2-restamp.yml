name: Restamp FHEM Exam Centre v2 assets
on:
  push:
    branches: [feature/fhem-exam-style-system]
    paths:
      - '.github/workflows/fhem-exam-v2-restamp.yml'
permissions:
  contents: write
jobs:
  restamp:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fhem-exam-style-system
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/stamp-versions.js
      - run: node scripts/stamp-versions.js --check
      - name: Commit asset fingerprints
        run: |
          if git diff --quiet; then
            echo 'No stamp changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' '*.js'
          git commit -m 'Refresh FHEM Exam Centre asset fingerprints'
          git push origin HEAD:feature/fhem-exam-style-system
