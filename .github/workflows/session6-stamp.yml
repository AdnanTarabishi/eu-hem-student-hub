name: Session 6 stamp
on:
  push:
    branches: [feature/fhe-session-6]
    paths:
      - 'fhe-session-6*'
      - 'course.html'
      - 'notes.html'
      - 'fhem-exam.html'
      - 'content/modules/fund-health-economics/**'
      - '.github/workflows/session6-stamp.yml'
permissions:
  contents: write
jobs:
  stamp:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fhe-session-6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Session 6 JavaScript syntax
        run: |
          node --check fhe-session-6.js
          node --check fhe-session-6-runtime.js
          node --check fhe-session-6-links.js
          node --check fhe-session-6-page.js
      - name: Stamp asset versions
        run: node scripts/stamp-versions.js
      - name: Commit generated stamps
        run: |
          if git diff --quiet; then
            echo 'No generated stamp changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' sw.js
          git commit -m 'Stamp Session 6 assets'
          git push origin HEAD:feature/fhe-session-6
