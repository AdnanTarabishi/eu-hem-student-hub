name: Correct FHEM exam-eve option score
on:
  push:
    branches: [feature/fhem-exam-eve-review]
    paths:
      - 'scripts/fix-fhem-exam-eve-option.js'
      - '.github/workflows/fhem-exam-eve-option-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fhem-exam-eve-review
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check scripts/fix-fhem-exam-eve-option.js
          node scripts/fix-fhem-exam-eve-option.js
          node --check fhem-exam-eve-data.js
          node scripts/stamp-versions.js
          node scripts/stamp-versions.js --check
      - name: Commit correction
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fhem-exam-eve-data.js '*.html' '*.js'
          git commit -m 'Correct FHEM exam-eve option scoring'
          git push origin HEAD:feature/fhem-exam-eve-review
