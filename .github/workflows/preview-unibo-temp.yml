name: Rebuild verified class calendars once
on:
  push:
    branches: [fix/unibo-course-authoritative-timetable-20261012]
permissions:
  contents: write
jobs:
  rebuild:
    if: "!startsWith(github.event.head_commit.message, 'Regenerate verified lesson calendars')"
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unibo-course-authoritative-timetable-20261012
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          git fetch origin main
          for f in calendar/*.ics; do
            git show "origin/main:$f" > "$f"
          done
          node scripts/build-calendar.js
          node tests/notes/schedule.test.js
          node tests/planning/unibo-course-source.test.js
          node scripts/stamp-versions.js --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar/
          if ! git diff --staged --quiet; then
            git commit -m "Regenerate verified lesson calendars and retain existing exams"
            git push origin HEAD:fix/unibo-course-authoritative-timetable-20261012
          fi
