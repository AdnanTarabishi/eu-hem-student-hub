name: Install FHEM final review

on:
  push:
    branches:
      - feature/fhem-final-exam-review
    paths:
      - ".github/fhem-review-concise/**"
      - ".github/workflows/install-fhem-final-review.yml"

permissions:
  contents: write

jobs:
  install:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fhem-final-exam-review
          fetch-depth: 0
      - name: Install review package
        run: |
          set -euo pipefail
          cat .github/fhem-review-concise/part* | base64 --decode > /tmp/fhem-final-review.tar.gz
          tar -xzf /tmp/fhem-final-review.tar.gz -C .
          rm -rf .github/fhem-review-concise .github/fhem-review-payload
          rm -f .github/workflows/install-fhem-final-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build FHEM final exam review"
          git push origin HEAD:feature/fhem-final-exam-review
