name: Install FHEM final review

on:
  push:
    branches:
      - feature/fhem-final-exam-review
    paths:
      - ".github/fhem-review-concise/**"
      - ".github/workflows/install-fhem-final-review.yml"

permissions:
  contents: write

jobs:
  install:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fhem-final-exam-review
          fetch-depth: 0
      - name: Verify and install review package
        run: |
          set -euo pipefail
          for file in .github/fhem-review-concise/part*; do
            wc -c "$file"
            sha256sum "$file"
          done
          cat .github/fhem-review-concise/part* | tr -d '\r\n\t ' > /tmp/fhem-final-review.b64
          wc -c /tmp/fhem-final-review.b64
          sha256sum /tmp/fhem-final-review.b64
          test "$(wc -c < /tmp/fhem-final-review.b64)" -eq 29188
          echo "996bdccd5d1ce4e7a2921576b3d90350eef1ffaf2725d1e87ef9e8c5d5bbf3cd  /tmp/fhem-final-review.b64" | sha256sum -c -
          base64 --decode /tmp/fhem-final-review.b64 > /tmp/fhem-final-review.tar.gz
          tar -tzf /tmp/fhem-final-review.tar.gz
          tar -xzf /tmp/fhem-final-review.tar.gz -C .
          rm -rf .github/fhem-review-concise .github/fhem-review-payload
          rm -f .github/workflows/install-fhem-final-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build FHEM final exam review"
          git push origin HEAD:feature/fhem-final-exam-review
