name: Prepare footer update
# Rerun after fixing multi-element footer assertions.
on:
  push:
    branches: ['codex/footer-official-socials-20261011']
    paths: ['.github/workflows/prepare-footer.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/footer-official-socials-20261011
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/stamp-versions.js
      - run: node scripts/check-content.js && node scripts/check-contrast.js && node scripts/stamp-versions.js --check
      - run: PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())") node tests/site/shell.test.js .
      - name: Commit only the verified stamps and remove this workflow
        run: |
          rm .github/workflows/prepare-footer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'Stamp verified footer and official programme links'
          git push origin HEAD:codex/footer-official-socials-20261011
