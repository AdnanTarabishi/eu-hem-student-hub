name: Prepare reviewed Roadmap content
on:
  push:
    branches: ['codex/prepare-roadmap-review-20261009']
    paths: ['.release-prep/**', '.github/workflows/prepare-roadmap-review.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref_name == 'codex/prepare-roadmap-review-20261009'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply only the six hash-verified review outputs
        run: |
          node .release-prep/apply.cjs
          node scripts/check-content.js
          node tests/roadmap/data.test.js .
          git diff --check
      - name: Commit reviewed output to this preparation branch only
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "codex/prepare-roadmap-review-20261009"
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          git config user.name "EU-HEM review preparation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/updates.json content/roadmap.json tests/roadmap/data.test.js tests/roadmap/browser.test.js README.md docs/roadmap.md
          git commit -m "Prepare the verified October release-history review"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          node -e 'const fs=require("fs"),cp=require("child_process");const files=Object.keys(JSON.parse(fs.readFileSync(".release-prep/changes.json")).outputHashes);const entries=files.map(file=>({path:file,sha:cp.execFileSync("git",["rev-parse","HEAD:"+file],{encoding:"utf8"}).trim()}));fs.writeFileSync("review-output.json",JSON.stringify({commit:cp.execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim(),entries},null,2));'
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-roadmap-output
          path: |
            review-output.json
            content/updates.json
            content/roadmap.json
            tests/roadmap/data.test.js
            tests/roadmap/browser.test.js
            README.md
            docs/roadmap.md
          retention-days: 7
