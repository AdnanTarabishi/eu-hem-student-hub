name: Final browser check FHEM exam-eve review
on:
  push:
    branches: [feature/fhem-exam-eve-review]
    paths:
      - '.github/workflows/fhem-exam-eve-browser-final.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fhem-exam-eve-review
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          node --check fhem-exam-eve-data.js
          node --check fhem-final-review.js
          node --check fhem-exam-v2.js
          node scripts/check-content.js
          node scripts/stamp-versions.js --check
      - name: Run focused browser regression
        run: |
          node - <<'NODE'
          const http=require('node:http'),fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict');
          const {chromium}=require('playwright');
          const root=process.cwd();
          const mime={'.html':'text/html','.js':'text/javascript','.css':'text/css','.json':'application/json','.md':'text/plain','.svg':'image/svg+xml','.woff2':'font/woff2','.png':'image/png','.webp':'image/webp','.webmanifest':'application/manifest+json'};
          (async()=>{
            const server=http.createServer((req,res)=>{const name=decodeURIComponent(new URL(req.url,'http://x').pathname).replace(/^\/eu-hem-student-hub\//,'');const file=path.resolve(root,name||'index.html');if(!file.startsWith(root+path.sep)||!fs.existsSync(file)||!fs.statSync(file).isFile()){res.writeHead(404);return res.end('missing');}res.writeHead(200,{'Content-Type':mime[path.extname(file)]||'application/octet-stream'});res.end(fs.readFileSync(file));}).listen(0,'127.0.0.1');
            await new Promise((r,j)=>{server.once('listening',r);server.once('error',j)});
            const base=`http://127.0.0.1:${server.address().port}/eu-hem-student-hub/`,browser=await chromium.launch({args:['--no-sandbox']}),errors=[];
            try{
              for(const [width,scheme] of [[1440,'light'],[390,'dark'],[320,'light']]){
                const context=await browser.newContext({viewport:{width,height:1000},colorScheme:scheme,serviceWorkers:'block',reducedMotion:'reduce'});
                await context.route(/^https?:\/\//,route=>new URL(route.request().url()).hostname==='127.0.0.1'?route.continue():route.abort());
                const page=await context.newPage();page.on('pageerror',e=>errors.push(`${width}:${e.message}`));
                await page.goto(base+'fhem-final-review.html');await page.locator('.review-shell').waitFor();
                assert.equal(await page.locator('.review-session-card').count(),8);assert.equal(await page.locator('.review-ta-card').count(),3);assert.equal(await page.locator('.review-formula-card').count(),10);assert.equal(await page.locator('.review-distinction').count(),15);assert.equal(await page.locator('.review-check-grid label').count(),12);
                await page.getByRole('button',{name:/Mark secure/}).click();assert.match(await page.locator('.review-rapid-side strong').innerText(),/1 \/ 18/);await page.reload();await page.locator('.review-shell').waitFor();assert.match(await page.locator('.review-rapid-side strong').innerText(),/1 \/ 18/);
                assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+1),false);await context.close();
              }
              const context=await browser.newContext({viewport:{width:1280,height:900},serviceWorkers:'block'});await context.route(/^https?:\/\//,route=>new URL(route.request().url()).hostname==='127.0.0.1'?route.continue():route.abort());const page=await context.newPage();page.on('pageerror',e=>errors.push(e.message));
              await page.goto(base+'course.html?course=fund-health-econ-management');await page.locator('.hem-course-panel').waitFor();assert.ok(await page.locator('a[href="fhem-final-review.html"]').count()>=2);
              await page.goto(base+'fhem-exam.html');await page.locator('.exam-v2-shell').waitFor();assert.equal(await page.locator('.exam-v2-fixed-grid .exam-v2-mode').count(),3);assert.match(await page.locator('.exam-v2-fixed-grid').innerText(),/MOCK EXAM 5/i);assert.match(await page.locator('.hem-exam-facts').innerText(),/3 fixed original mocks/i);
              for(const [topic,needle] of [['fund-health-economics.health-capital','TA revision lens'],['fund-health-economics.disparities','TA notation check'],['fund-health-economics.physician-agency','TA fee-cut decomposition']]){await page.goto(base+`lecture.html?topic=${encodeURIComponent(topic)}`);await page.locator('#lecture-content:not([hidden])').waitFor();assert.match(await page.locator('#learn').innerText(),new RegExp(needle,'i'));}
              await context.close();assert.deepEqual(errors,[]);console.log('PASS: FHEM final review, Mock 5, TA addenda, persistence and mobile layouts.');
            }finally{await browser.close();await new Promise(r=>server.close(r));}
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
