name: Update Notes practice runtime bank
on:
  push:
    branches: [feature/fhem-exam-eve-review]
    paths:
      - 'scripts/update-notes-practice-runtime-bank.js'
      - '.github/workflows/notes-practice-runtime-bank.yml'
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fhem-exam-eve-review
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check scripts/update-notes-practice-runtime-bank.js
          node scripts/update-notes-practice-runtime-bank.js
          node --check tests/notes/practice.test.js
      - name: Commit runtime-bank regression update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/notes/practice.test.js
          git commit -m 'Load exam-eve additions in Notes practice regression'
          git push origin HEAD:feature/fhem-exam-eve-review
