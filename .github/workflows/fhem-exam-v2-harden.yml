name: Harden FHEM Exam Centre v2 output
on:
  push:
    branches: [feature/fhem-exam-style-system]
    paths:
      - 'scripts/harden-fhem-exam-v2-output.js'
      - '.github/workflows/fhem-exam-v2-harden.yml'
permissions:
  contents: write
jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fhem-exam-style-system
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/harden-fhem-exam-v2-output.js
      - run: node scripts/harden-fhem-exam-v2-output.js
      - run: node --check fhem-exam-v2.js
      - name: Commit output hardening
        run: |
          if git diff --quiet; then
            echo 'No hardening changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fhem-exam-v2.js
          git commit -m 'Harden FHEM written-response rendering'
          git push origin HEAD:feature/fhem-exam-style-system
