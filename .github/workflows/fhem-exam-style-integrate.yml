name: Integrate FHEM exam-style system
on:
  push:
    branches: [feature/fhem-exam-style-system]
    paths:
      - 'scripts/integrate-fhem-exam-style.js'
      - '.github/workflows/fhem-exam-style-integrate.yml'
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fhem-exam-style-system
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check fhem-exam-style-bank.js
          node --check fhem-exam-v2.js
          node --check scripts/integrate-fhem-exam-style.js
      - name: Integrate files
        run: node scripts/integrate-fhem-exam-style.js
      - name: Stamp asset versions
        run: node scripts/stamp-versions.js
      - name: Validate data
        run: |
          node scripts/check-content.js
          node scripts/stamp-versions.js --check
          node tests/fhem-exam-style/data.test.js
      - name: Commit integrated files
        run: |
          if git diff --quiet; then
            echo 'No integration changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fhem-exam-v2.js fhem-exam.html health-econ-management.js sw.js package.json
          git commit -m 'Integrate FHEM exam-style system'
          git push origin HEAD:feature/fhem-exam-style-system
