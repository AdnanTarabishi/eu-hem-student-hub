<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Announcements – EU-HEM Student Hub</title>
  <meta name="description" content="News and announcements for EU-HEM students.">
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#1f4e79">
  <script src="theme.js"></script>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <p class="site-title"><a href="index.html">EU-HEM Student Hub</a></p>
      <p class="site-tagline">Unofficial, student-run resources for the EU-HEM master's program</p>
      <!-- site-nav.js builds the menu here (defined once for all pages) -->
      <nav class="site-nav" id="site-nav" data-current="announcements" aria-label="Main menu"></nav>
      <script src="site-nav.js"></script>
    </div>
  </header>

  <main class="container">
    <section class="card announcements-page">
      <h2>Announcements</h2>

      <!-- announcements.js shows this only while the sample (fake) data is used -->
      <p id="announcement-demo-note" class="demo-note" hidden>
        <strong>Demo announcements</strong> — these are examples only, not real news.
      </p>

      <!-- announcements.js adds one button per category -->
      <div id="announcement-filters" class="track-tabs announcement-filters" role="tablist" aria-label="Filter by category"></div>

      <p id="announcement-status" class="placeholder">Loading announcements...</p>
      <div id="announcement-list" class="announcement-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>EU-HEM Student Hub &middot; Unofficial student project</p>
    </div>
  </footer>

  <script src="utils.js"></script>
  <script src="ui.js"></script>
  <script src="search.js"></script>
  <script src="announcements.js"></script>

</body>
</html>
