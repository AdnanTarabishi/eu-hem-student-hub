<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Past Thesis Explorer – EU-HEM Student Hub</title>
  <meta name="description" content="Search thesis topics from previous EU-HEM cohorts: an informal historical archive for inspiration.">
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css?v=414676c0">
  <meta name="theme-color" content="#20242a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="img/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <script src="theme.js?v=2016aab7"></script>
</head>
<body class="thesis-page">

  <header class="site-header">
    <div class="container">
      <p class="site-title"><a href="index.html">EU-HEM Student Hub</a></p>
      <p class="site-tagline">Unofficial, student-run resources for the EU-HEM master's program</p>
      <!-- site-nav.js builds the menu here (defined once for all pages) -->
      <nav class="site-nav" id="site-nav" data-current="thesis" aria-label="Main menu"></nav>
      <script src="site-nav.js?v=00f10cac"></script>
    </div>
  </header>

  <!-- thesis.js fills the page from content/thesis-archive.json (generated by scripts/import-thesis.js)
       and content/thesis-config.json. No numbers are written here: they all come from the data. -->
  <main class="container thesis">
    <p id="thesis-status" class="placeholder" aria-live="polite">Loading the thesis archive…</p>

    <!-- Intro, historical notice, "In this archive" -->
    <section id="thesis-intro" class="thesis-intro" aria-labelledby="thesis-title" hidden></section>

    <!-- Search, filters and results -->
    <section id="thesis-explorer" class="thesis-section" aria-labelledby="thesis-explorer-title" hidden>
      <h2 id="thesis-explorer-title" class="visually-hidden">Search and filter thesis topics</h2>
      <div class="thesis-search">
        <label for="thesis-search" class="thesis-search-label">Search thesis topics</label>
        <div class="thesis-search-box">
          <svg class="icon" aria-hidden="true"><use href="icons.svg#search"></use></svg>
          <input id="thesis-search" type="search" placeholder="Search thesis topics…" autocomplete="off" spellcheck="false">
        </div>
      </div>
      <details id="thesis-filters" class="thesis-filters">
        <summary><span id="thesis-filters-summary">Filters</span></summary>
        <div class="thesis-filter-grid">
          <label>Cohort <select id="filter-cohort"></select></label>
          <label>Legacy track <select id="filter-track"></select></label>
          <label>University <select id="filter-university"></select></label>
          <label>Sort <select id="thesis-sort"></select></label>
        </div>
      </details>
      <div class="thesis-active">
        <div id="thesis-chips" class="thesis-chips"></div>
        <button id="thesis-clear" type="button" class="button button-quiet" hidden>Clear filters</button>
      </div>
      <p id="thesis-count" class="thesis-count" role="status" aria-live="polite"></p>
      <ol id="thesis-results" class="thesis-results"></ol>
      <div id="thesis-empty" class="thesis-empty" hidden>
        <p>No thesis topics match these filters.</p>
        <button type="button" class="button" data-clear>Clear filters</button>
      </div>
      <button id="thesis-more" type="button" class="button button-light thesis-more" hidden>Show more</button>
    </section>

    <!-- Browse: legacy tracks, universities, tracks × universities -->
    <section id="thesis-browse" class="thesis-section" aria-labelledby="browse-tracks-title" hidden></section>

    <!-- A few varied examples -->
    <section id="thesis-examples" class="thesis-section" aria-labelledby="thesis-examples-title" hidden></section>

    <!-- Inspiration, your own thesis, source -->
    <section id="thesis-notes" class="thesis-section" aria-labelledby="thesis-inspiration-title" hidden></section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>EU-HEM Student Hub &middot; Unofficial student project</p>
    </div>
  </footer>

  <script defer src="utils.js?v=671dcb1b"></script>
  <script defer src="ui.js?v=3026c782"></script>
  <script defer src="search.js?v=488e0e19"></script>
  <script defer src="pwa.js?v=c9212bf8"></script>
  <script defer src="announcements.js?v=4ad85af3"></script>
  <script defer src="thesis-data.js?v=19f9c8f5"></script>
  <script defer src="thesis.js?v=86d87593"></script>

</body>
</html>
