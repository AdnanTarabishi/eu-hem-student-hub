<!DOCTYPE html>
<!-- The social preview card (1200 x 630 px), the picture shown when a link to the site is shared.
     Rendered to img/social-preview.png by: node scripts/make-social-image.js
     Colours and fonts are the site's own (style.css tokens, fonts/). Edit the text here, then re-run. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: "Inter"; src: url("../../fonts/inter-latin.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Source Serif 4"; src: url("../../fonts/source-serif-4-latin-600.woff2") format("woff2"); font-weight: 600; }

  :root {
    --navy-900: #0f2b5b;
    --navy-950: #091d3a;
    --terracotta: #e78562;
    --text-soft: #c9d3e3;
    --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative;
    overflow: hidden;
    padding: 64px 72px;
    color: var(--white);
    font-family: "Inter", sans-serif;
    /* Navy with a soft dot pattern, like the page headers on the site */
    background:
      radial-gradient(rgba(255, 255, 255, 0.07) 1.5px, transparent 1.6px) 0 0 / 22px 22px,
      linear-gradient(135deg, var(--navy-900) 0%, var(--navy-950) 100%);
  }

  .brand { display: flex; align-items: center; gap: 18px; }
  .brand-mark {
    display: grid; place-items: center;
    width: 76px; height: 76px;
  }
  .brand-mark svg { width: 76px; height: 76px; }
  .brand-name { font-weight: 700; font-size: 40px; line-height: 1; letter-spacing: -0.02em; }
  .brand-product { font-weight: 700; font-size: 24px; margin-top: 4px; color: var(--text-soft); }

  h1 {
    margin-top: 58px;
    max-width: 900px;
    font-family: "Source Serif 4", serif;
    font-weight: 600;
    font-size: 68px;
    line-height: 1.08;
    letter-spacing: -0.01em;
  }
  h1 span { color: var(--terracotta); }

  .topics { margin-top: 26px; font-size: 26px; color: var(--text-soft); }

  .footer {
    position: absolute; left: 72px; right: 72px; bottom: 56px;
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 22px;
    border-top: 1px solid rgba(255, 255, 255, 0.16);
    font-size: 22px; color: var(--text-soft);
  }
  .cities { display: flex; gap: 10px; }
  .city {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 14px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    font-size: 19px; font-weight: 600; color: var(--white);
  }
  .city::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--dot); }

  /* Terracotta accent bar, as in the app icon */
  .accent { position: absolute; left: 0; top: 0; bottom: 0; width: 12px; background: var(--terracotta); }
</style>
</head>
<body>
  <div class="accent"></div>

  <div class="brand">
    <span class="brand-mark">
      <!-- hub-mark:start -->
      <svg viewBox="0 0 64 64" style="--hub-badge:#f7f5f1;--hub-pulse:#0f2b5b">
    <rect width="64" height="64" rx="16" fill="var(--hub-badge,#0f2b5b)"/>
    <polyline points="9,40 19,40 24,27 30,49 35,37 41,37 54,19" fill="none"
      stroke="var(--hub-pulse,#ffffff)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="54" cy="19" r="5.5" fill="var(--hub-accent,#c75b3a)"/>
  </svg>
      <!-- hub-mark:end -->
    </span>
    <span>
      <span class="brand-name">EU-HEM</span>
      <span class="brand-product" style="display:block">Student Hub</span>
    </span>
  </div>

  <h1>Less searching.<br><span>More learning, living and connecting.</span></h1>
  <p class="topics">Timetable · Exams · Study plan · Notes · City guides · Students</p>

  <div class="footer">
    <span>Unofficial · student-run · free</span>
    <span class="cities">
      <span class="city" style="--dot:#e78562">Bologna</span>
      <span class="city" style="--dot:#7fb0d4">Oslo</span>
      <span class="city" style="--dot:#8cbca4">Innsbruck</span>
      <span class="city" style="--dot:#8fb3cf">Rotterdam</span>
    </span>
  </div>
</body>
</html>
