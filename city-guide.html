<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>City Guide – EU-HEM Student Hub</title>
  <meta name="description" content="Practical city guides for EU-HEM students, written by students.">
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#1f4e79">
  <script src="theme.js"></script>
</head>
<body>

  <!-- Same header as the home page; menu links point back to the home page sections -->
  <header class="site-header">
    <div class="container">
      <p class="site-title"><a href="index.html">EU-HEM Student Hub</a></p>
      <p class="site-tagline">Unofficial, student-run resources for the EU-HEM master's program</p>
      <!-- site-nav.js builds the menu here (defined once for all pages) -->
      <nav class="site-nav" id="site-nav" data-current="city-guide" aria-label="Main menu"></nav>
      <script src="site-nav.js"></script>
    </div>
  </header>

  <main class="container">
    <!-- guide.js loads the city's Markdown file and puts the guide here.
         Which city: city-guide.html?city=bologna (Bologna is the default). -->
    <article id="guide" class="card guide">
      <p id="guide-status" class="placeholder">Loading guide...</p>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>EU-HEM Student Hub &middot; Unofficial student project</p>
    </div>
  </footer>

  <!-- "marked" converts Markdown to HTML. The integrity hash makes the browser
       refuse the file if it was changed on the CDN. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/18.0.14/lib/marked.umd.min.js"
          integrity="sha512-trN9mtGYvoySPVI909KTnwbJI9AkKPydRCV/qAsUG1+q39hhpKltEag9b5JpdjeIZn5i8IH62hHRFdbKwMFh9w=="
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="utils.js"></script>
  <script src="ui.js"></script>
  <script src="search.js"></script>
  <script src="announcements.js"></script>
  <script src="guide.js"></script>

</body>
</html>
