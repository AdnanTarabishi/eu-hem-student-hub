<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timetable – EU-HEM Student Hub</title>
  <meta name="description" content="1st-year EU-HEM class timetable, live from UniBo: week and list view, rooms and maps.">
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css?v=b9162737">
  <meta name="theme-color" content="#0f2b5b" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#091d3a" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="img/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <script src="theme.js?v=d51d4769"></script>
</head>
<body class="wide-page">

  <header class="site-header">
    <div class="container">
      <p class="site-title"><a href="index.html">EU-HEM Student Hub</a></p>
      <p class="site-tagline">Unofficial, student-run resources for the EU-HEM master's program</p>
      <!-- site-nav.js builds the menu here (defined once for all pages) -->
      <nav class="site-nav" id="site-nav" data-current="timetable" aria-label="Main menu"></nav>
      <script src="site-nav.js?v=d17eb375"></script>
    </div>
  </header>

  <main class="container">
    <section class="page-intro">
      <div>
        <p class="section-eyebrow">Academics</p>
        <h1><svg class="icon" aria-hidden="true"><use href="icons.svg#timetable"></use></svg> Timetable</h1>
        <p>1st-year classes, loaded live from the
          <a id="timetable-source" href="https://corsi.unibo.it/2cycle/euHealthEconomicsManagement/timetable" target="_blank" rel="noopener">official UniBo timetable</a>.
          If anything looks different, the official page is always right.</p>
      </div>
    </section>

    <!-- "Now" and "Next" class (timetable.js) -->
    <div id="now-next" class="now-next" hidden></div>

    <section class="card">
      <div class="toolbar">
        <div id="view-switch" class="segmented" role="group" aria-label="View"></div>
        <div id="week-nav" class="week-nav" hidden></div>
        <div class="toolbar-filters schedule-filters">
          <label>Course
            <select id="course-filter"><option value="">All courses</option></select>
          </label>
          <label class="checkbox-label" id="show-past-label">
            <input type="checkbox" id="show-past"> Show past classes
          </label>
        </div>
      </div>
      <h2 class="visually-hidden">Classes</h2>
      <p id="schedule-status" class="schedule-meta" aria-live="polite"></p>
      <div id="schedule-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>EU-HEM Student Hub &middot; Unofficial student project</p>
    </div>
  </footer>

  <script defer src="utils.js?v=ba40a359"></script>
  <script defer src="ui.js?v=6d55e433"></script>
  <script defer src="search.js?v=8af84713"></script>
  <script defer src="pwa.js?v=c9212bf8"></script>
  <script defer src="announcements.js?v=3ecd40f0"></script>
  <script defer src="programme.js?v=bc6eeb23"></script>
  <script defer src="unibo-data.js?v=7939f2b4"></script>
  <script defer src="timetable.js?v=9e8032ed"></script>

</body>
</html>
